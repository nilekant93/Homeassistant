# ─────────────────────────────────────────────────────────────────────────────
# Kotitabletti — uusi käyttöliittymä (v2)
#
# Luo tälle OMA kojelauta (Asetukset → Kojelaudat → Lisää kojelauta) ja liitä
# tämä sinne. Älä liitä nykyisen päälle — vanha jää silloin koskemattomaksi.
#
# Koko käyttöliittymä on yhdessä kortissa, koska designin sivupalkki on
# pysyvä. Kortti hoitaa reitityksen itse, joten sivunvaihto on välitön.
#
# Toteutettuna: Koti, Valot ja Asetukset. Sivupalkin muut kohdat (Imuri,
# Kauppalista, Junat) näkyvät himmennettyinä eivätkä reagoi kosketukseen.
# ─────────────────────────────────────────────────────────────────────────────

kiosk_mode:
  entity_settings:
    - entity:
        input_boolean.kiosk_moodi: "on"
      kiosk: true
    - entity:
        input_boolean.kiosk_moodi: "off"
      kiosk: false

views:
  - title: Kotitabletti
    path: koti
    icon: mdi:home
    # panel = yksi kortti täyttää näkymän. Yhdessä kioskitilan kanssa tämä
    # antaa koko 1280 × 800 ruudun kortin käyttöön.
    type: panel
    # HA:n panel-näkymä jättää reunoille marginaalin, joka rikkoisi
    # täysleveän asettelun.
    card_mod:
      style: |
        hui-panel-view {
          padding: 0 !important;
        }
        hui-panel-view > * {
          margin: 0 !important;
        }
    cards:
      - type: custom:kotitabletti-app

        # ── Yleiset ──────────────────────────────────────────────────────────
        start_page: koti

        # Palaa aloitussivulle kun ruutuun ei ole koskettu. 0 = ei koskaan.
        # Ajastin nollautuu myös sormen liikkeestä, ei pelkästä painalluksesta,
        # ja pysähtyy niin kauan kuin väripaletti-ikkuna on auki.
        idle_return_seconds: 10
        idle_exempt_pages:
          - asetukset

        # Teema: light | dark | schedule.
        # Käsivalinta asetussivulta kytkee ajastuksen pois, ja ajastuksen
        # päälle kytkeminen poistaa käsivalinnan korostuksen.
        #
        # Valinta tallentuu tabletin localStorageen. Jos haluat sen myös
        # automaatioiden ulottuville, luo valintalista-aputoiminto arvoilla
        # light / dark / schedule ja osoita se tähän:
        # theme_mode_entity: input_select.tabletin_teema
        default_theme_mode: schedule

        theme_schedule:
          # sun   = seuraa auringonnousua ja -laskua
          # times = kiinteät kellonajat alla
          source: sun
          sun_entity: sun.sun

          # Pakotettu yö. Tämä on Oulussa tarpeen: kesäkuussa aurinko on
          # horisontin yläpuolella lähes vuorokauden, joten pelkkä aurinko
          # pitäisi ruudun kirkkaana läpi yön.
          force_dark_from: "23:00"
          force_dark_to: "06:30"

          # Käytetään vain jos source: times
          light_at: "07:00"
          dark_at: "21:00"

        # ── Navigaatio ───────────────────────────────────────────────────────
        nav:
          - page: koti
            label: Koti
            icon: home
          - page: valot
            label: Valot
            icon: bulb
          - page: imuri
            label: Imuri
            icon: vacuum
          - page: kauppa
            label: Kauppalista
            icon: cart
          - page: junat
            label: Junat
            icon: train

        settings_nav:
          page: asetukset
          label: Asetukset
          icon: sliders

        # ── Kotinäkymä ───────────────────────────────────────────────────────
        home:
          weather:
            entity: weather.forecast_koti
            forecast_days: 5

          calendar:
            show_week_numbers: true
            next_event_from: calendar.suomen_juhlapyhat

          # Täsmälleen neljä mahtuu 2 × 2 -ruudukkoon.
          # dimmer = kirkkauspalkki, tilarivi ja valon oma väri
          # switch = pelkkä kytkin, teal-aksentti
          lights:
            - entity: light.tv
              name: Lattiavalot
              style: dimmer
              icon: bulb
            - entity: light.cottonvalot
              name: Cottonpallot
              style: switch
              icon: cotton
            - entity: light.valoverho
              name: Valoverho
              style: switch
              icon: curtain
            - entity: light.makkarin_valopallot
              name: Joulutähti
              style: switch
              icon: star

        # ── Valot-sivu ───────────────────────────────────────────────────────
        lights:
          # Hero-kortti: kirkkausliuku ja väripaletti. Väririvi näkyy vain jos
          # lamppu ilmoittaa tukevansa värejä, joten sama kortti kelpaa myös
          # pelkälle himmennettävälle valolle.
          primary:
            entity: light.tv
            name: Lattiavalot
            icon: bulb

          # Loput pelkkinä kytkiminä.
          others:
            - entity: light.cottonvalot
              name: Cottonpallot
              icon: cotton
            - entity: light.valoverho
              name: Valoverho
              icon: curtain
            - entity: light.makkarin_valopallot
              name: Joulutähti
              icon: star

        # ── Asetukset-sivu ───────────────────────────────────────────────────
        settings:
          kiosk_toggle: input_boolean.kiosk_moodi
          show_reload: true
